<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>001</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="Container">
    <h1>Relatório Financeiro</h1>

    <br><br>

    <form id="uploadForm">
  <label>Mês de referência</label>
  <input type="month" name="month" required />

  <label>Arquivo XLS (1)</label>
  <input type="file" name="files" accept=".xls,.xlsx" />

  <label>Arquivo XLS (2)</label>
  <input type="file" name="files" accept=".xls,.xlsx" />

  <button type="submit">Enviar</button>
</form>

<br><br>

    <label for="accountSelect">Escolha a conta:</label>
    <select id="accountSelect" class="select">
      <option value="">Todas as contas</option>
    </select>

    <br><br>
    <label for="ownerSelect">Escolha o gerente:</label>
<select id="ownerSelect" class="select">
  <option value="">Todos os gerentes</option>
</select>

    <br><br>

    <div class="filters">
      <button class="btn active" onclick="showAllMonths()">Ano</button>
      <button class="btn" onclick="showTrimester(1)">T1</button>
      <button class="btn" onclick="showTrimester(2)">T2</button>
      <button class="btn" onclick="showTrimester(3)">T3</button>
      <button class="btn" onclick="showTrimester(4)">T4</button>
    </div>

    <br><br>

    <div id="yearlyOverview"></div>
<br><br>
    <div id="yearsContainer"></div>

    <script>
      const numberFormatter = new Intl.NumberFormat("pt-BR", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      const months = [
        ["jan","Jan"],["fev","Fev"],["mar","Mar"],
        ["abr","Abr"],["mai","Mai"],["jun","Jun"],
        ["jul","Jul"],["ago","Ago"],["set","Set"],
        ["out","Out"],["nov","Nov"],["dez","Dez"]
      ];
      
      const trimesters = {
        1: [1,2,3], 2: [4,5,6], 3: [7,8,9], 4: [10,11,12]
      };
      
      /* ---------- LOAD DATA ---------- */

      async function loadAccounts() {
        const owner = document.getElementById("ownerSelect").value;
        const accountSelect = document.getElementById("accountSelect");

        let url = "/api/accounts";
        if (owner) {
          url += `?owner=${encodeURIComponent(owner)}`;
        }

        const res = await fetch(url);
        const data = await res.json();

        // 🔥 FULL RESET (this is the missing piece)
        accountSelect.innerHTML = "";

        // Default option
        const defaultOpt = document.createElement("option");
        defaultOpt.value = "";
        defaultOpt.textContent = "Todas as contas";
        accountSelect.appendChild(defaultOpt);

        // Add filtered accounts only
        data.forEach(a => {
          const opt = document.createElement("option");
          opt.value = a.ccusto;
          opt.textContent = a.ccusto;
          accountSelect.appendChild(opt);
        });
      }

      async function loadOwners() {
        const res = await fetch("/api/owners");
        const data = await res.json();

        const sel = document.getElementById("ownerSelect");

        data.forEach(o => {
          const opt = document.createElement("option");
          opt.value = o.gerente;
          opt.textContent = o.gerente;
          sel.appendChild(opt);
        });
      }

      async function loadMonthlyProfit() {
        const account = document.getElementById("accountSelect").value;
        const owner   = document.getElementById("ownerSelect").value;

        let params = [];
        if (account) params.push(`account=${encodeURIComponent(account)}`);
        if (owner)   params.push(`owner=${encodeURIComponent(owner)}`);

        let url = "/api/monthly-profit";
        if (params.length) url += "?" + params.join("&");

        const res = await fetch(url);
        const data = await res.json();
        renderYears(data);
      }

      async function loadYearlyOverview() {
        const account = document.getElementById("accountSelect").value;
        const owner   = document.getElementById("ownerSelect").value;

        let params = [];
        if (account) params.push(`account=${encodeURIComponent(account)}`);
        if (owner)   params.push(`owner=${encodeURIComponent(owner)}`);

        let url = "/api/yearly-overview";
        if (params.length) url += "?" + params.join("&");

        const res = await fetch(url);
        const json = await res.json();

        renderYearlyOverview(json);
      }


      /* ---------- RENDER ---------- */

      function renderYearlyOverview({ years, data }) {
        const container = document.getElementById("yearlyOverview");
        container.innerHTML = "";

        const table = document.createElement("table");

        table.innerHTML = `
          <thead>
            <tr>
              <th>Tópico</th>
              ${years.map(y => `<th>${y}</th>`).join("")}
              <th>Total</th>
            </tr>
          </thead>
          <tbody></tbody>
        `;

        const tbody = table.querySelector("tbody");
          
        let lastTitulo = null;

        Object.entries(data).forEach(([topic, values]) => {
          console.log(topic, values);

          if (values.titulo && values.titulo !== lastTitulo) {
                const trTitle = document.createElement("tr");
                trTitle.className = "title-row";
                trTitle.innerHTML = `
                  <td colspan="${years.length + 2}">
                    ${values.titulo}
                  </td>
                `;
                tbody.appendChild(trTitle);
                lastTitulo = values.titulo;
              }

          let rowTotal = 0;

          const yearCells = years.map(y => {
            const v = values[y] || 0;
            rowTotal += v;
            return `<td>${numberFormatter.format(v)}</td>`;
          });
            
          const tr = document.createElement("tr");
          tr.className = "topic-row";

          tr.innerHTML = `
            <td>${topic}</td>
            ${yearCells.join("")}
            <td><strong>${numberFormatter.format(rowTotal)}</strong></td>
          `;

          tbody.appendChild(tr);
        });

        container.appendChild(table);
      }


      function renderYears(data) {
        const container = document.getElementById("yearsContainer");
        container.innerHTML = "";

        Object.keys(data).filter(year => year !== "null")
          .sort((a, b) => Number(b) - Number(a))
          .forEach(year => {
          const h = document.createElement("h2");
          h.textContent = `▶ ${year}`;
          h.className = "year"

          const table = document.createElement("table");
          table.style.display = "none";

          table.innerHTML = `
      <thead>
        <tr>
          <th>Categoria</th>
          ${months.map((m, i) => `<th data-month="${i + 1}">${m[1]}</th>`).join("")}
        </tr>
      </thead>
      <tbody></tbody>
    `;

          const tbody = table.querySelector("tbody");

          let lastTitulo = null;

Object.entries(data[year]).forEach(([topic, obj]) => {

  // 👇 TITLE ROW (once per change)
  if (obj.titulo && obj.titulo !== lastTitulo) {
    tbody.appendChild(titleRow(obj.titulo));
    lastTitulo = obj.titulo;
  }

  tbody.appendChild(topicRow(topic, obj.totals));

  obj.categories.forEach(c => {
    const row = categoryRow(c);
    row.style.display = "none";
    tbody.appendChild(row);
  });
});

          h.onclick = () => {
            table.style.display = table.style.display === "none" ? "table" : "none";
            h.textContent = (table.style.display === "none" ? "▶ " : "▼ ") + year;
          };

          container.appendChild(h);
          container.appendChild(table);
        });
      }

      /* ---------- ROWS ---------- */
      
      function titleRow(text) {
      const tr = document.createElement("tr");
      tr.className = "title-row";
      tr.innerHTML = `
        <td colspan="${months.length + 1}">
          ${text}
        </td>
      `;
      return tr;
    }


      function topicRow(name, totals) {
        const tr = document.createElement("tr");
        tr.className = "topic-row collapsed";
        tr.innerHTML = `<td>
          <span class="topic-toggle">▶</span>
          ${name}
          </td>` +
          months.map((m, i) => `<td data-month="${i + 1}">${numberFormatter.format(totals[m[0]])}</td>`).join("");

           tr.addEventListener("click", () => toggleCategories(tr));
        return tr;
      }

      function categoryRow(r) {
        const tr = document.createElement("tr");
        tr.className = "category-row";

        tr.innerHTML = `<td>${r.category_name}</td>` +
          months.map((m, i) => `<td data-month="${i + 1}">${numberFormatter.format(r[m[0]])}</td>`).join("");
        return tr;
      }

      /* ---------- FILTERS ---------- */

      //Submit
      document.getElementById("uploadForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);

        const res = await fetch("/api/upload-transacoes", {
          method: "POST",
          body: formData
        });

        alert(await res.text());
      });

      function hideAllMonths() {
        document.querySelectorAll("[data-month]").forEach(td => td.style.display = "none");
      }

      function showMonth(m) {
        document.querySelectorAll(`[data-month="${m}"]`)
          .forEach(td => td.style.display = "");
      }

      function showTrimester(t) {
        hideAllMonths();
        trimesters[t].forEach(showMonth);
      }

      function showAllMonths() {
        document.querySelectorAll("[data-month]").forEach(td => td.style.display = "");
      }

      function toggleCategories(topicRow) {
        //getting the next sibling. The next row
        let row = topicRow.nextElementSibling;
        //This adds the "collapsed" class if it doesn't exist and returns true. Returns false if it removes the class
        const isCollapsed = topicRow.classList.toggle("collapsed");

        //while the next row is not a topic row
        while (row && !row.classList.contains("topic-row")) {
          if (row.classList.contains("category-row")) {
            //if it is collapsed, display none, else restore the normal css
            row.style.display = isCollapsed ? "none" : "";
          }
          //get the next sibling to continue the loop
          row = row.nextElementSibling;
        }
        //get the span with the arrow
        const icon = topicRow.querySelector(".topic-toggle");
        //if we just collapsed, change the arrow
        if (icon) icon.textContent = isCollapsed ? "▶" : "▼";
      }

      /* ---------- INIT ---------- */

      document.getElementById("accountSelect")
        .addEventListener("change", () => {
          loadMonthlyProfit();
          loadYearlyOverview();
        });

      document.getElementById("ownerSelect")
        .addEventListener("change", () => {
          loadAccounts();
          loadMonthlyProfit();
          loadYearlyOverview();
        });
      loadOwners();
      loadAccounts();
      loadYearlyOverview();
      loadMonthlyProfit();

    </script>
  </div>
</body>

</html>
